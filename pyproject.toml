[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnome-windeploy"
version = "0.1.0"
description = "Deployment tool for GNOME-platform desktop apps on Windows (the GNOME equivalent of windeployqt)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "gnome-windeploy contributors" }]
keywords = ["gnome", "gtk", "windows", "deployment", "windeployqt", "msys2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["pefile>=2023.2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gnome-windeploy = "gnome_windeploy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gnome_windeploy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
