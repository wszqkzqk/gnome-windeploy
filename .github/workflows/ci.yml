name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (unit tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  windows-msys2:
    name: Windows MSYS2 UCRT64 package
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
      - name: Build the MSYS2 package (build + check + package)
        run: |
          cd "$GITHUB_WORKSPACE/distros/msys2"
          makepkg-mingw --noconfirm -s
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: distros/msys2/*.pkg.tar.zst
